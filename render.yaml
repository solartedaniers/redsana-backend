# Blueprint de Render para el backend. Los secretos van con sync: false para
# que se carguen en el dashboard y nunca queden en el repositorio.
# Solo aplica si el servicio se creó como Blueprint; si se creó desde el panel,
# estos mismos valores se configuran allí a mano.
services:
  - type: web
    name: redsana-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render termina el HTTPS en su proxy: sin forwarded-allow-ips, uvicorn
    # generaría redirecciones http:// que el navegador bloquea como mixed content.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    # Producción tal como corre hoy. Los secretos van con sync: false (su valor solo está en el panel); el resto de
    # las variables de .env.example usa el valor por defecto de app/core/config.py.
    envVars:
      # Secretos obligatorios.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # HMAC de la huella de red: debe ser el mismo en todo backend que use esta base, o cada red recalibra.
      - key: NETWORK_ID_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Producción llama al servicio de IA desplegado aparte (redsana-ai-engine en Render).
      - key: AI_MODE
        value: remote
      - key: AI_SERVICE_URL
        value: https://redsana-ai-engine.onrender.com
      - key: AI_SERVICE_API_KEY
        sync: false
      # Plazo del calentamiento de la IA: el arranque en frío del plan gratuito puede pasar de 5 minutos.
      - key: AI_SERVICE_WARM_UP_TIMEOUT_SECONDS
        value: "600"
      # Solo hace falta con AI_MODE=local; se conserva para poder volver a ese modo desde el panel.
      - key: GROQ_API_KEY
        sync: false
